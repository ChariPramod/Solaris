[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solari-gauntlet"
version = "0.8.0"
description = "State-verified reliability evaluations for computer-use agents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "Flask>=3.1,<4", "Pillow>=11,<13", "rich>=13,<15", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
live = ["solari-desktop==0.2.0", "anthropic>=1.5,<2", "openai>=2,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pypdf>=6,<7"]
fixtures = ["reportlab>=4,<6"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gauntlet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
